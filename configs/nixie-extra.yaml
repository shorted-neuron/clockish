---
# nixie-extra.yaml  --  nixie-tube-style clock with room sensors and weather
# 12-hour clock, date, and temperatures from two LAN sensors and a weather API,
# for an 800x480 landscape display.  See nixie24.yaml for the plain 24-hour layout.
# ---------------------------------------------------------------------------
# Requires the Nixie One font (SIL OFL 1.1 license).
# Nixie One is a Google Font by Jovanny Lemonad  --  a faithful recreation of
# the warm, glowing cathode style of vintage Nixie tube displays.
#
# Install:
#   bash scripts/download-nixie-font.sh
#
# (No apt package exists for Nixie One; the script downloads it from the
#  Google Fonts GitHub repository.)
#
# Font file installed:
#   third_party/nixie/NixieOne-Regular.ttf
#   (only one weight/style is available for this font)
#
# See also: https://fonts.google.com/specimen/Nixie+One
#           https://github.com/google/fonts/tree/main/ofl/nixieone
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Orientation hint  --  landscape | portrait | square
#   landscape: aspect ratio >= ~1.5  (e.g. 480x320, 800x480, 1920x1080)
#   portrait:  aspect ratio <= ~0.7  (e.g. 320x480)
#   square:    aspect ratio ~ 1.0
#
# This hint is informational; it helps users pick the right config for their
# display.  All row heights and font sizes below are percentages of the
# display HEIGHT so this layout scales automatically to any landscape display.
# ---------------------------------------------------------------------------
orientation: landscape
preview_size: 800x480

# ---------------------------------------------------------------------------
# default_font  --  TTF file used for all built-in scale font names.
#
# When set, every standard font name (giant, huge, big, med, normal, small,
# tiny, micro) is loaded from this file at the appropriate percentage of the
# display height  --  no explicit 'fonts:' section is needed for a single
# typeface.  The file is searched in all subdirectories of third_party/.
# ---------------------------------------------------------------------------
default_font: NixieOne-Regular.ttf

cached-facts:
  - name: sensor-inside
    type: url-fact
    url: http://sensor-inside.lan/last-json
    interval: 2m
    timeout: 5
    preview_response: '{"tempF": "71.8"}'

  - name: sensor-outfront
    type: url-fact
    url: http://sensor-outfront.lan/last-json
    interval: 10m
    preview_response: '{"tempF": "68.5"}'

  - name: norman-ok-weather
    type: url-fact
    url: |-
      https://api.open-meteo.com/v1/forecast?
      latitude=35.2&longitude=-97.4
      &current=temperature_2m
      &temperature_unit=fahrenheit
    interval: 15m
    preview_response: '{"current": {"temperature_2m": 88.2}}'

rows:
  - name: clock
    height: 54%
    panels:
      - type: clock
        timezone: US/Mountain
        time_format: "%-I:%M"
        color: burntsienna
        font_size: 40px
        font_behavior: scale_numeric
        padding: 10

  - name: divider-1
    height: "1%"
    panels:
      - type: divider
        height: 1
        color: dimred

  - name: date
    height: "20%"
    panels:
      - type: date
        width: 50%
        justify: left
        timezone: US/Mountain
        date_format: "%A, %B %-d"
        color: rust
        font_size: 40px
        font_behavior: default

      - type: blank
        width: 25%

      - type: fact
        width: 20%
        justify: right
        source: cached-facts.sensor-inside
        json_path: tempF
        color: rust
        font_size: auto
      - type: text
        width: 5%
        label: "°F"
        color: rust
        font_size: 24px

  - name: divider-2
    height: "1%"
    panels:
      - type: divider
        height: 1
        color: dimred

  - name: row3
    height: "12%"
    panels:
      - type: wifi_graphic
        width: 7%
        color: rust
      - type: fact
        width: 43%
        justify: left
        source: hostname
        color: burntsienna
        font_size: tiny
      - type: text
        width: 35%
        justify: right
        label: "outside: "
        color: rust
        font_size: 24px

      - type: fact
        width: 10%
        source: cached-facts.sensor-outfront
        json_path: "tempF"
        justify: right
        color: rust
        font_size: 40px
        transform:
          - round: 0

      - type: text
        width: 5%
        label: "°F"
        color: rust
        font_size: 24px

  - name: row4
    height: "12%"
    background: black
    panels:
      - type: fact
        width: 15%
        justify: left
        source: ip
        color: rust
        font_size: 20px
      - type: fact
        justify: center
        width: 15%
        source: backlight
        color: grey
        font_size: 20px
      - type: fact
        width: 10%
        justify: left
        source: cpu
        transform: [round]
        color: rust
        font_size: 28px

      - type: text
        width: 30%
        justify: right
        label: "Norman, OK: "
        color: rust
        font_size: 24px
      - type: clock
        width: 15%
        timezone: US/Central
        time_format: "%-I:%M%p"
        color: dimred
        font_size: 42px
        transform:
          - lower
          - replace: {from: 'm', to: ''}  # replace am or pm with just a or p
      - type: fact
        width: 10%
        source: cached-facts.norman-ok-weather
        json_path: "current.temperature_2m"
        justify: right
        color: rust
        font_size: 40px
        transform:
          - round: 0

      - type: text
        width: 5%
        label: "°F"
        color: rust
        font_size: 24px
