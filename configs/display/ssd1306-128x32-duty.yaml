# ssd1306  --  128x32 1-bit tiny OLED display
# ---------------------------------------------------------------------------
# ssd1306-128x32.yaml plus duty_cycle: lit only :55-:04 each minute (burn-in).
# Use this profile with a monochrome 128x32 SSD1306 panel, e.g.:
#   clockish --display configs/display/ssd1306-128x32-duty.yaml configs/tiny32.yaml
# Same chip and wiring as the 128x64 profile; only the height differs.
# ---------------------------------------------------------------------------

display:
  driver:       ssd1306
  width:        128
  height:       32
  rotation:     0
  clear_on_exit: true  # this is an oled, so prevent burn in by clearing on exit
  # i2c_addr:     0x3C  # optional, default: 0x3C is most common (some 128x32 modules use 0x3D)
  # i2c_bus:      1     # optional, /dev/i2c-N (default 1: the header pins SDA=GPIO2, SCL=GPIO3)
  duty_cycle:             # blank the panel except for a window each period (burn-in)
    period:   60s        # wall-clock aligned; must divide 86400 (60s, 5m, 15m, 1h ...)
    show_at:  55s        # offset into the period where the panel turns on
    show_for: 10s        # lit :55 through :04, dark from :05 (the window wraps the period)
