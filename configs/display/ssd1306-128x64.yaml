---
# ssd1306  --  128x64 1-bit tiny OLED display
# ---------------------------------------------------------------------------
# Use this profile with a monochrome 128x64 SSD1306 panel, e.g.:
#   clockish --display configs/display/ssd1306-128x64.yaml configs/tiny.yaml
# ---------------------------------------------------------------------------

display:
  driver:       ssd1306
  width:        128
  height:       64
  rotation:     0
  clear_on_exit: true  # this is an oled, so prevent burn in by clearing on exit
  # i2c_addr:     0x3C  # optional, default: 0x3C is most common
  # i2c_bus:      1     # optional, /dev/i2c-N (default 1: the header pins SDA=GPIO2, SCL=GPIO3)
  # duty_cycle:           # optional: blank the panel except for a window each period (burn-in)
  #   period:   60s        # wall-clock aligned; must divide 86400 (60s, 5m, 15m, 1h ...)
  #   show_at:  55s        # offset into the period where the panel turns on
  #   show_for: 10s        # lit :55 through :04, dark from :05 (the window wraps the period)
