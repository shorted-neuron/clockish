---
# ssd1306  --  128x64 1-bit tiny OLED display
# ---------------------------------------------------------------------------
# Use this profile with a monochrome 128x64 SSD1306 panel, e.g.:
#   clockish --display configs/display/ssd1306-128x64.yaml configs/tiny.yaml
# ---------------------------------------------------------------------------

display:
  driver:       ssd1306
  width:        128
  height:       64
  rotation:     0
  clear_on_exit: true  # this is an oled, so prevent burn in by clearing on exit
  # i2c_addr:     0x3C  # optional, default: 0x3C is most common
  # i2c_bus:      1     # optional, /dev/i2c-N (default 1: the header pins SDA=GPIO2, SCL=GPIO3)
  # Burn-in protection: an OLED lit at full brightness all day burns in badly.
  # Remove duty_cycle only if you accept that.  See README "OLED burn-in".
  duty_cycle:
    steps:                         # one minute, wall-clock aligned (period = sum of 'for')
      - {for: 5s, level: full}     # :00-:04 full brightness
      - {for: 25s, level: half}    # :05-:29 about half (lowest VCOMH)
      - {for: 30s, level: dim}     # :30-:59 dimmest level visible on every module tested
    # levels:                      # tune for this module; built-ins shown
    #   full: {contrast: 255, vcomh: high}
    #   half: {contrast: 255, vcomh: low}
    #   dim:  {contrast: 1, vcomh: low}   # contrast 0 or 'precharge: short' is dark on some modules
    # other step modes: {for: 10s, mode: invert} (lit/unlit swapped), {for: 10s, mode: blank} (off)
