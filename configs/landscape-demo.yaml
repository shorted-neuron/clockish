---
# landscape-demo.yaml  --  clockish config
# ---------------------------------------------------------------------------
# Display layout configuration for clockish
# Display settings are in display.yaml  --  use configs/display/ili9486-landscape.yaml.
# ---------------------------------------------------------------------------

orientation: landscape

rows:
  - name: utc-clock
    height: 22%
    panels:
      - type: clock
        justify: center
        timezone: UTC
        time_format: 24hs
        color: lime
        font_size: auto
        font_behavior: scale_numeric

  - name: divider-1
    height: 5px
    panels:
      - type: divider
        height: 1px
        color: darkgrey

  - name: utc-date
    height: 13.13%
    panels:
      - type: date
        justify: center
        timezone: UTC
        date_format: "%A, %B %-d  UTC"
        color: darklime
        font_size: auto

  - name: divider-2
    height: 5px
    panels:
      - type: divider
        height: 1px
        color: darkgrey


  - name: world-clocks
    height: 16.25%
    panels:
      - type: clock
        # justify: center
        timezone: America/Denver
        time_format: 24h
        color: cornflower
        font_size: auto
      - type: divider
        width: 2%
        color: black
      - type: clock
        # justify: center
        width: 31%
        background: darkred
        timezone: US/Eastern
        time_format: 24h
        color: orange
        font_size: auto
      - type: divider
        width: 2%
        color: black
      - type: clock
        # justify: center
        timezone: Asia/Kolkata
        time_format: 24h
        background: black
        color: brown
        font_size: auto

  - name: world-labels
    height: 13.13%
    panels:
      - type: text
        # justify: center
        label: " Denver"
        color: cornflower
        font_size: auto
        background: black
      - type: divider
        width: 2%
        color: black
      - type: text
        # justify: center
        width: 31%
        label: "US/Eastern"
        background: darkred
        color: orange
        font_size: small
      - type: divider
        width: 2%
        color: black
      - type: text
        # justify: center
        label: "India"
        font_size: auto
        color: brown

  - name: divider-3
    height: 5px
    panels:
      - type: divider
        height: 1px

  - name: wifi-info
    height: 10.63%
    panels:
      - type: wifi_graphic
        width: 9.17%
        # justify: center
        color: white
      - type: fact
        # justify: center
        width: 25%
        source: wifi_status
        color: ff8888
        font_size: auto
      - type: fact
        # justify: center
        width: 40%
        source: wifi_ssid
        label: "SSID "
        color: skyblue
        font_size: small
      - type: fact
        # justify: center
        width: 25%
        source: wifi_signal
        color: pink
        font_size: small
#      - type: fact
#        # justify: center
#        width: 15%
#        source: wifi_quality
#        label: "qual:"
#        color: purple
#        font_size: auto
#        font_behavior: stretch_x

  - name: host-ip
    height: 10%
    panels:
      - type: fact
        width: 40%
        justify: center
        source: hostname
        color: green
        font_size: auto
      - type: fact
        source: uptime
        color: silver
        padding: 0
        font_behavior: stretch_y
  - name: host-ip
    height: 10%
    panels:
      - type: fact
        width: 40%
        justify: center
        source: ip
        color: green
        font_size: auto
      - type: debug
