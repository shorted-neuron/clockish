---
# landscape-demo.yaml  --  clockish config
# ---------------------------------------------------------------------------
# Display settings are in display.yaml  --  use configs/display/ili9486-landscape.yaml or similar
# ---------------------------------------------------------------------------

orientation: landscape
preview_size: 480x320

cached-facts:
  - name: Denver-Weather
    type: url-fact
    url: |-
      https://api.open-meteo.com/v1/forecast?
      latitude=39.5727&longitude=-104.8494
      &current=temperature_2m,wind_speed_10m,wind_direction_10m
      &temperature_unit=fahrenheit
      &windspeed_unit=mph
    interval: 20m

  - name: Atlanta-Weather
    type: url-fact
    url: |-
      https://api.open-meteo.com/v1/forecast?
      latitude=33.8761&longitude=-84.4598
      &current=temperature_2m,wind_speed_10m,wind_direction_10m
      &temperature_unit=fahrenheit
      &windspeed_unit=mph
    interval: 20m

  - name: India-Weather
    type: url-fact
    url: |-
      https://api.open-meteo.com/v1/forecast?
      latitude=12.680916&longitude=79.350600
      &current=temperature_2m,wind_speed_10m,wind_direction_10m
      &temperature_unit=celsius
      &windspeed_unit=kmh
    interval: 20m

rows:
  - name: clock
    height: 32%
    panels:
      - type: clock
        width: 66.67%
        justify: right
        timezone: UTC
        time_format: "  %H:%M"
        color: silver
        font_size: auto
        font_behavior: scale
      - type: clock
        width: 33%
        justify: left
        timezone: US/Mountain
        time_format: ":%S"
        color: grey
        font_size: auto

  - name: divider-1
    height: 2%
    panels:
      - type: divider
        height: 1px
        color: darkgrey

  - name: utc-date
    height: 13%
    panels:
      - type: date
        justify: center
        timezone: UTC
        date_format: "%A, %B %-d  UTC"
        color: darklime
        font_size: auto

  - name: divider-2
    height: 2%
    panels:
      - type: divider
        height: 1px
        color: darkgrey


  - name: world-clocks
    height: 16%
    panels:
      - type: clock
        width: 32%
        timezone: America/Denver
        time_format: 24h
        color: cornflower
        font_size: auto
      - type: divider
        width: 2%
        color: black
      - type: clock
        width: 31%
        background: dimred
        timezone: US/Eastern
        time_format: 24h
        color: orange
        font_size: auto
      - type: divider
        width: 2%
        color: black
      - type: clock
        width: 32%
        timezone: Asia/Kolkata
        time_format: 24h
        background: black
        color: brown
        font_size: auto

  - name: world-labels  # aligns with row above
    height: 13%
    panels:
      - type: text
        width: 32%
        label: "Denver"
        color: cornflower
        font_size: auto
        background: black
      - type: divider
        width: 2%
        color: black
      - type: text
        width: 31%
        label: "Atlanta"
        background: dimred
        color: orange
        font_size: small
      - type: divider
        width: 2%
        color: black
      - type: text
        width: 32%
        label: "India"
        font_size: auto
        color: brown

  - name: world-temps  # aligns with row above
    height: 13%
    panels:
      - type: fact
        source: cached-facts.Denver-Weather
        width: 16.1%  # needs slight nudge on 480x320
        json_path: "current.temperature_2m"
        justify: center
        color: cornflower
        background: black
        font_size: auto
        transform:
          - round: 0
          - suffix: "°F"

      - type: fact
        source: cached-facts.Denver-Weather
        width: 16%
        json_path: "current.temperature_2m"
        justify: center
        color: cornflower
        background: black
        font_size: tiny
        transform:
          # Convert F to C with built-in.  see later for example with filters
          - fahrenheit_to_celsius
          - format: "{:.0f}"
          - suffix: "°C"

      - type: divider
        width: 2%
        color: black

      - type: fact
        source: cached-facts.Atlanta-Weather
        width: 16%
        json_path: "current.temperature_2m"
        justify: center
        color: orange
        background: dimred
        font_size: auto
        transform:
          - round: 0
          - suffix: "°F"

      - type: fact
        source: cached-facts.Atlanta-Weather
        width: 15%
        json_path: "current.temperature_2m"
        justify: center
        color: orange
        background: dimred
        font_size: tiny
        transform:
          # the harder way - Convert F to C: (F - 32) / 1.8
          - subtract: 32
          - divide: 1.8
          - format: "{:.0f}"
          - suffix: "°C"

      - type: divider
        width: 2%
        color: black

      - type: fact
        source: cached-facts.India-Weather
        width: 16%
        json_path: "current.temperature_2m"
        justify: center
        color: brown
        background: black
        font_size: tiny
        transform:
          # Convert C to F
          - celsius_to_fahrenheit
          - format: "{:.0f}"
          - suffix: "°F"

      - type: fact
        source: cached-facts.India-Weather
        width: 16%
        json_path: "current.temperature_2m"
        justify: center
        color: brown
        background: black
        font_size: auto
        transform:
          - format: "{:.0f}°C"

  - name: divider-3
    height: 2%
    panels:
      - type: divider
        height: 1px

  - name: system-info
    height: 8%
    panels:
      - type: wifi_graphic
        width: 8%
        color: darklime
      - type: blank
        width: 3%
      - type: fact
        width: 22%
        justify: center
        source: hostname
        color: grey
        font_size: tiny
      - type: fact
        justify: center
        source: ntp_status
        color: grey
        font_size: tiny
      - type: fact
        source: ip
        justify: center
        color: grey
        font_size: tiny
